name: Dependency audit

on:
  schedule:
    # Run weekly on Monday 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      # `pnpm audit` reads pnpm-lock.yaml directly, so no install is needed.
      #
      # Hard gate: advisories in the production graph (what ships in the
      # packaged extension) fail the job and notify the maintainer.
      - name: pnpm audit --prod (moderate+, blocking)
        run: pnpm audit --prod --audit-level moderate
      # Report only: the full graph includes development tools. Findings are
      # written to the run summary and a warning annotation, but never fail the
      # job, so dev-tool noise cannot leave the schedule permanently red and
      # get the workflow disabled again.
      - name: pnpm audit (full graph, moderate+, report only)
        if: ${{ !cancelled() }}
        run: |
          set +e
          output="$(pnpm audit --audit-level moderate 2>&1)"
          status=$?
          set -e
          {
            echo "## Full dependency audit (report only)"
            echo
            echo '```text'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Development dependency advisories::pnpm audit reports moderate-or-higher advisories outside the production graph. See the run summary and CONTRIBUTING.md#dependency-audits."
          fi
