name: Live GitHub DOM canary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-github-dom-canary
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LIVE_GITHUB_REPOSITORY: cli/cli
  WXT_GITHUB_APP_CLIENT_ID: TESTING_CLIENT_ID
  WXT_GITHUB_APP_SLUG: test-app

jobs:
  live-github-dom-canary:
    name: Live GitHub DOM canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:build
      - run: pnpm test:e2e:live
      - name: Upload successful stage diagnostics
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-github-dom-canary-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/canary-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-github-dom-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
